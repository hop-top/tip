name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Tidy
        run: |
          make tidy
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test E2E
        run: make test-e2e
